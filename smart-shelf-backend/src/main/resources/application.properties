# Database connection (H2 file-based persistence for instant offline development, env var override for prod)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/smartshelf;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Port
server.port=${PORT:8080}

# Weather API settings (Configurable via environment variables)
weather.api.key=${WEATHER_API_KEY:cb89d2ef8f4d13b16447bc50cdf5405b}
weather.shop.latitude=${SHOP_LATITUDE:13.038190}
weather.shop.longitude=${SHOP_LONGITUDE:80.156548}